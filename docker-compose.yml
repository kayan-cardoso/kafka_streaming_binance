services:

  kafka:
    image: apache/kafka:latest
    container_name: kafka
    ports:
      - "29092:29092"

    environment:
      #KRaft
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker, controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093

      KAFKA_LISTENERS: INTERNAL://:9092,EXTERNAL://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      
      # Single broker
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1

      # Retenção 
      KAFKA_LOG_RETENTION_HOURS: 168

    volumes:
      - kafka_data:/var/lib/kafka/data

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui

    ports:
      - "8080:8080"

    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092

    depends_on:
      - kafka

  binance-producer:
    build:
      context: .
      dockerfile: src/producer/Dockerfile
    container_name: binance-producer
    depends_on:
      - kafka
    restart: unless-stopped

  zookeeper-pinot:
    image: zookeeper:3.9
    container_name: zookeeper-pinot
    restart: unless-stopped
    ports: 
      - "2181:2181"
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    depends_on:
      - kafka
    volumes:
      - zookeeper_pinot_data:/data
      - zookeeper_pinot_datalog:/datalog
    healthcheck:
      test: ["CMD", "zkServer.sh", "status"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 10s

  pinot-controller:
    image: apachepinot/pinot:1.5.1
    container_name: pinot-controller
    command: "StartController -zkAddress zookeeper-pinot:2181"
    restart: unless-stopped
    ports:
      - "9000:9000"
    environment:
      JAVA_OPTS: "-Xmx512M -Xms512M"
    volumes:
      - pinot_controller_data:/data
    depends_on:
      - zookeeper-pinot
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 10s

  pinot-broker:
    image: apachepinot/pinot:1.5.1
    container_name: pinot-broker
    command: "StartBroker -zkAddress zookeeper-pinot:2181"
    restart: unless-stopped
    ports:
      - "8099:8099"
    environment:
      JAVA_OPTS: "-Xmx512M -Xms512M"
    depends_on:
      - pinot-controller
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8099/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 10s

  pinot-server:
    image: apachepinot/pinot:1.5.1
    container_name: pinot-server
    command: "StartServer -zkAddress zookeeper-pinot:2181"
    restart: unless-stopped
    ports:
      - "8098:8098"
    environment:
      JAVA_OPTS: "-Xmx1G -Xms1G"
    volumes:
      - pinot_server_data:/data
    depends_on:
      - pinot-broker
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8097/health/readiness || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 10s


volumes:
  kafka_data:
  zookeeper_pinot_data:
  zookeeper_pinot_datalog:
  pinot_controller_data:
  pinot_server_data:


